name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:v1.29.2
        ports: ['1025:1025', '8025:8025']
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: family
          POSTGRES_PASSWORD: family
          POSTGRES_DB: family_network_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U family -d family_network_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://family:family@localhost:5432/family_network_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run seed:validate
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
